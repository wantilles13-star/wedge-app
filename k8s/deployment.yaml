apiVersion: apps/v1
kind: Deployment
metadata:
  name: wedge-app-splash
  labels:
    app.kubernetes.io/name: wedge-app-splash
    app.kubernetes.io/part-of: wedge-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wedge-app-splash
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wedge-app-splash
        app.kubernetes.io/part-of: wedge-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: ghcr.io/wantilles13-star/wedge-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
