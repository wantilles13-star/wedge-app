name: tenant-guardrails

on:
  pull_request:
    paths:
      - "k8s/**"
      - "deploy/**"
      - "Chart.yaml"
      - "values.yaml"
      - "policy/**"
      - "homelab-tenant.yaml"
      - "scripts/**"
      - ".github/workflows/tenant-guardrails.yaml"
  push:
    branches: [main]
    paths:
      - "k8s/**"
      - "deploy/**"
      - "Chart.yaml"
      - "values.yaml"
      - "policy/**"
      - "homelab-tenant.yaml"
      - "scripts/**"
      - ".github/workflows/tenant-guardrails.yaml"

env:
  # kubeconform expects x.y.z — no leading `v`
  KUBERNETES_VERSION: "1.31.0"
  KUSTOMIZE_VERSION: v5.4.3
  HELM_VERSION: v3.16.2
  CONFTST_VERSION: v0.46.0
  RENDER_PATH: ""
  MANIFEST_OUTPUT: rendered.yaml

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Install kustomize
        run: |
          curl -sSL -o /tmp/kustomize.tar.gz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz
          tar -C /tmp -xzf /tmp/kustomize.tar.gz
          sudo mv /tmp/kustomize /usr/local/bin/kustomize

      - name: Install helm
        run: |
          curl -sSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash -s -- --version ${HELM_VERSION}

      - name: Install conftest
        run: |
          curl -sSL -o /tmp/conftest.tar.gz https://github.com/open-policy-agent/conftest/releases/download/${CONFTST_VERSION}/conftest_${CONFTST_VERSION#v}_Linux_x86_64.tar.gz
          tar -C /tmp -xzf /tmp/conftest.tar.gz conftest
          sudo mv /tmp/conftest /usr/local/bin/conftest

      - name: Render manifests
        run: bash scripts/render-manifests.sh

      - name: Schema validate
        run: kubeconform -strict -summary -kubernetes-version ${KUBERNETES_VERSION} ${MANIFEST_OUTPUT}

      - name: Policy validate
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "homelab-tenant.yaml" ]; then
            conftest test ${MANIFEST_OUTPUT} --policy policy --data homelab-tenant.yaml
          else
            conftest test ${MANIFEST_OUTPUT} --policy policy
          fi
