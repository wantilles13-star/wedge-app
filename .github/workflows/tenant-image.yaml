name: tenant-image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - k8s/static/**
      - .github/workflows/tenant-image.yaml
      - .trivyignore
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-scan:
    runs-on: ubuntu-24.04-arm
    env:
      TRIVY_DISABLE_VEX_NOTICE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - id: prep
        shell: bash
        run: |
          set -euo pipefail
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          provenance: false
          tags: |
            ${{ steps.prep.outputs.image }}:latest
            ${{ steps.prep.outputs.image }}:${{ github.sha }}
      - name: Trivy Dockerfile config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.prep.outputs.image }}:${{ github.sha }}
          trivyignores: .trivyignore
          severity: CRITICAL,HIGH
          exit-code: "1"
